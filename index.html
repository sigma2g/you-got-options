<!DOCTYPE html>
<html lang="en">

    <title>You Got Options — Trading Journal</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f5f4;
        color: #1a1a1a;
        min-height: 100vh;
      }
      #root {
        max-width: 680px;
        margin: 0 auto;
        background: #ffffff;
        min-height: 100vh;
      }
      input, textarea, button, select {
        font-family: inherit;
      }
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f5f5f4;
        --color-background-info: #e6f1fb;
        --color-background-success: #EAF3DE;
        --color-background-warning: #FAEEDA;
        --color-background-danger: #FCEBEB;
        --color-text-primary: #1a1a1a;
        --color-text-secondary: #4a4a4a;
        --color-text-tertiary: #888880;
        --color-text-info: #185fa5;
        --color-text-success: #3B6D11;
        --color-text-warning: #854F0B;
        --color-text-danger: #A32D2D;
        --color-border-tertiary: rgba(0,0,0,0.1);
        --color-border-secondary: rgba(0,0,0,0.2);
        --color-border-primary: rgba(0,0,0,0.3);
        --color-border-info: #378add;
        --color-border-success: #639922;
        --color-border-warning: #BA7517;
        --color-border-danger: #E24B4A;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
        --border-radius-xl: 16px;
      }
